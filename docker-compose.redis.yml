services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "redis12345"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis12345", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  redis-data:
